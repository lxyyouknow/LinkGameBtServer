<body>
  <div id="login" class="login"><form id="loginForm"><h1>LinkGame BT</h1><p>经营数据与广告质量后台</p><input id="account" autocomplete="username" placeholder="管理员账号"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button class="primary" type="submit">登录</button><div id="loginStatus" class="status"></div></form></div>
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="header-main"><div class="brand">LinkGame BT <small>经营数据后台</small></div><nav class="tabs"><button class="tab active" data-tab="overview">经营总览</button><button class="tab" data-tab="daily">每日趋势</button><button class="tab" data-tab="adRanking">激励排行</button><button class="tab" data-tab="ads">广告总览</button><button class="tab" data-tab="startup">启动诊断</button><button class="tab" data-tab="levels">关卡分析</button><button class="tab" data-tab="themes">主题与道具</button><button class="tab" data-tab="ranking">闯关排行</button></nav></div>
      <div class="filter-wrap"><div class="date-filter"><span class="filter-caption">日期范围</span><button id="dateRangeTrigger" class="date-trigger" type="button">选择日期范围</button><input id="from" type="hidden"><input id="to" type="hidden"><div id="dateRangePanel" class="date-panel"><div class="date-panel-head"><span id="rangeSummary" class="range-summary"></span><span class="note">选择新增玩家日期范围</span></div><div class="calendar-nav"><button id="prevMonth" type="button">‹</button><b id="calendarHeader"></b><button id="nextMonth" type="button">›</button></div><div id="calendarMonths" class="calendar-months"></div><div class="quick-ranges"><button type="button" data-range="today">今天</button><button type="button" data-range="yesterday">昨天</button><button type="button" data-range="7">近 7 天</button><button type="button" data-range="30">近 30 天</button></div><div class="date-panel-actions"><button id="resetRange" class="ghost" type="button">恢复今天</button><button id="applyRange" class="primary" type="button">应用日期</button></div></div></div><label>平台<select id="sdk"><option value="1000">TikTok（上线数据）</option><option value="0">Web / 测试</option><option value="">全部平台</option></select></label><button id="refresh" class="primary">刷新</button><span class="spacer"></span><span class="note">报表时区：<b id="timezone">读取中</b></span><button id="logout" class="ghost">退出</button></div>
    </header>
    <main class="main"><div id="content"></div></main>
  </div>
  <div id="trendModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div><h2 id="trendTitle">指标趋势</h2><p id="trendScope">多日按首次进入日期、单日按首次进入小时拆分；每个点均为对应 cohort 截至当前的累计表现</p></div><button id="trendClose" class="modal-close" type="button" aria-label="关闭">×</button></div><div class="view-switch"><button class="segment-btn active" type="button" data-trend-view="chart">图表</button><button class="segment-btn" type="button" data-trend-view="table">表格</button></div><div id="trendSummary" class="trend-summary"></div><div id="trendChartWrap" class="trend-chart"><canvas id="trendChart"></canvas></div><div id="trendTableWrap" class="trend-table hidden"><table><thead><tr><th id="trendPeriodHeader">新增日期</th><th id="trendValueHeader">指标</th><th>新增玩家</th></tr></thead><tbody id="trendTableBody"></tbody></table></div><div id="trendEmpty" class="empty hidden">所选范围暂无可展示数据</div></div></div>
  <script>
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],SESSION='pairpop-bt.gm.session';let tab='overview',charts=[],trendChart=null,trendCache=null,trendView='chart',activeTrend=null,adView='rewarded',draftRange={start:null,end:null},viewMonth=null;
  const placementName={hint:'魔杖',shuffle:'洗牌道具',auto_remove:'火箭消除 / 进度宝箱',level_complete:'通关奖励',daily_gift:'每日礼包',daily_challenge_replay:'每日挑战追加次数',season_makeup:'赛季补签',potion:'魔药解锁',level_complete_every_three:'每三关插屏',revive:'复活'},formatName={rewarded:'激励广告',interstitial:'插屏广告'},stageName={capability:'能力 / 配置',create:'广告创建',load:'广告加载',show:'拉起展示',play:'播放过程',close:'提前关闭',reward_claim:'奖励核销',legacy:'旧版未分类'},startupStageName={sdk_start:'SDK 登录开始',sdk_success:'SDK 登录成功',sdk_fail:'SDK 登录失败',exchange_start:'服务端换取身份开始',exchange_success:'服务端换取身份成功',exchange_fail:'服务端换取身份失败',interactive_ready:'首个界面可操作'},stepName={level_start:'进入关卡',first_click:'首次点击',first_match:'首次消除',progress_25:'完成 25%',progress_50:'完成 50%',progress_75:'完成 75%',level_pass:'通关',next_level:'进入下一关',retry:'重试',level_fail:'失败'};
  const trendMeta={newPlayers:['新增玩家','newPlayers','count'],averageLoginCount:['人均登录次数','averageLoginCount','decimal'],enterGameRate:['进入游戏成功率','enterGameRate','percent'],mainLevelEnterRate:['进入主线率','mainLevelEnterRate','percent'],averageOnlineSeconds:['人均在线时长','averageOnlineSeconds','duration'],day1RetentionRate:['次日留存','day1RetentionRate','percent'],day3RetentionRate:['3 日留存','day3RetentionRate','percent'],day7RetentionRate:['7 日留存','day7RetentionRate','percent'],rewardedAdWatchRate:['激励完播用户率','rewardedAdWatchRate','percent'],rewardedAdSuccesses:['激励广告完播总数','rewardedAdSuccesses','count'],averageRewardedAdSuccesses:['人均激励完播数','averageRewardedAdSuccesses','decimal'],rewardedAdRewardClaims:['激励奖励到账','rewardedAdRewardClaims','count'],interstitialAdNormalCloses:['插屏正常关闭','interstitialAdNormalCloses','count']};
  function localDate(offset=0){const d=new Date(Date.now()+offset*86400000),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
  function parseDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return null;const [y,m,d]=value.split('-').map(Number),date=new Date(y,m-1,d);return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d?date:null}
  function formatDate(date){const z=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${z(date.getMonth()+1)}-${z(date.getDate())}`}
  function startMonth(date){return new Date(date.getFullYear(),date.getMonth(),1)}
  function moveMonth(date,offset){return new Date(date.getFullYear(),date.getMonth()+offset,1)}
  function sameDate(a,b){return !!a&&!!b&&formatDate(a)===formatDate(b)}
  function normalizedRange(){if(draftRange.start&&!draftRange.end)return{start:draftRange.start,end:draftRange.start};if(!draftRange.start&&draftRange.end)return{start:draftRange.end,end:draftRange.end};if(draftRange.start&&draftRange.end&&draftRange.start>draftRange.end)return{start:draftRange.end,end:draftRange.start};return{...draftRange}}
  function rangeText(){const r=normalizedRange();return r.start&&r.end?`${formatDate(r.start)} ~ ${formatDate(r.end)}`:r.start?`${formatDate(r.start)} ~ …`:'请选择日期范围'}
  function renderCalendarMonth(month){const y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),r=normalizedRange(),days=[];for(let i=0;i<offset;i++)days.push('<button class="calendar-day blank" type="button"></button>');for(let d=1;d<=last;d++){const current=new Date(y,m,d),time=current.getTime(),boundary=sameDate(current,r.start)||sameDate(current,r.end),inside=r.start&&r.end&&time>r.start.getTime()&&time<r.end.getTime();days.push(`<button class="calendar-day${boundary?' boundary':inside?' in-range':''}" type="button" data-date="${formatDate(current)}">${d}</button>`)}return `<div class="calendar-month"><div class="calendar-title">${y} 年 ${m+1} 月</div><div class="calendar-weekdays">${['一','二','三','四','五','六','日'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar-grid">${days.join('')}</div></div>`}
  function renderCalendars(){const first=startMonth(viewMonth||new Date()),second=moveMonth(first,1);$('#calendarHeader').textContent=`${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')} — ${second.getFullYear()}-${String(second.getMonth()+1).padStart(2,'0')}`;$('#rangeSummary').textContent=rangeText();$('#calendarMonths').innerHTML=renderCalendarMonth(first)+renderCalendarMonth(second);$$('[data-date]').forEach(button=>button.onclick=()=>selectDate(button.dataset.date))}
  function selectDate(value){const picked=parseDate(value);if(!picked)return;if(!draftRange.start||(draftRange.start&&draftRange.end))draftRange={start:picked,end:null};else if(picked<draftRange.start)draftRange={start:picked,end:draftRange.start};else draftRange={start:draftRange.start,end:picked};renderCalendars()}
  function openDatePanel(event){event.stopPropagation();const panel=$('#dateRangePanel'),open=!panel.classList.contains('open');if(open){draftRange={start:parseDate($('#from').value),end:parseDate($('#to').value)};viewMonth=startMonth(draftRange.start||new Date());renderCalendars()}panel.classList.toggle('open',open)}
  function updateDateLabel(){$('#dateRangeTrigger').textContent=$('#from').value&&$('#to').value?`${$('#from').value} ~ ${$('#to').value}`:'选择日期范围'}
  function setQuickRange(kind){const end=parseDate(localDate()),start=new Date(end);if(kind==='yesterday'){start.setDate(start.getDate()-1);end.setDate(end.getDate()-1)}else if(Number(kind)>1)start.setDate(start.getDate()-Number(kind)+1);draftRange={start,end};viewMonth=startMonth(start);renderCalendars()}

    <div class="panel"><div class="panel-head"><div><h2>广告位转化对比</h2><p>同一广告位并排比较预加载、请求、展示和完成；柱长与次数成正比</p></div><div class="legend"><span><i class="dot" style="background:var(--purple)"></i>预加载</span><span><i class="dot" style="background:var(--main)"></i>请求</span><span><i class="dot" style="background:var(--blue)"></i>展示</span><span><i class="dot" style="background:var(--green)"></i>完成</span></div></div>${placements.length?`<div id="adPlacementChartWrap" class="ad-placement-chart"><canvas id="adPlacementChart"></canvas></div><div class="ad-placement-list">${placements.map(x=>`<div class="ad-placement-item"><div class="ad-placement-name"><b>${h(placementName[x.placement]||x.placement||'未标记')}</b><span class="note">${h(formatName[x.format]||x.format)}</span></div><div class="ad-placement-metrics"><span class="metric-chip preload">预加载 ${num(x.preloads)}</span><span class="metric-chip">请求 ${num(x.requests)}</span><span class="metric-chip">展示 ${num(x.shows)}</span><span class="metric-chip">完成 ${num(x.successes)}</span><span class="metric-chip warn">未完播 ${num(x.earlyCloses)}</span><span class="metric-chip fail">失败 ${num(x.failures)}</span>${x.format==='rewarded'?`<span class="metric-chip">到账 ${num(x.claims)}</span>`:''}</div></div>`).join('')}</div>`:'<div class="empty">暂无广告数据</div>'}</div>
    <div class="panel"><div class="panel-head"><div><h2>广告逐日明细</h2><p>用于对账客户端版本、广告形式和业务位</p></div></div><table><thead><tr><th>日期</th><th>版本</th><th>平台</th><th>形式</th><th>业务位</th><th>请求</th><th>创建</th><th>加载</th><th>展示</th><th>完成</th><th>未完播</th><th>SDK 失败</th><th>奖励到账 / 失败</th><th>展示率</th><th>完成率</th><th>到账率</th><th>加载 / 拉起 / 播放</th></tr></thead><tbody>${items.map(x=>`<tr><td>${h(x.date)}</td><td>${h(x.clientVersion)}</td><td>${h(x.platform)}</td><td>${h(formatName[x.format]||x.format)}</td><td>${h(placementName[x.placement]||x.placement)}</td><td>${num(x.requests)}</td><td>${num(x.creates)} <span class="note">预热 ${num(x.preloadCreates)}</span></td><td>${num(x.loads)}</td><td>${num(x.shows)}</td><td>${num(x.successes)}</td><td>${num(x.earlyCloses)}</td><td>${num(x.failures)}</td><td>${x.format==='rewarded'?num(x.rewardClaims)+' / '+num(x.rewardClaimFailures):'-'}</td><td>${pct(x.showRate)}</td><td>${pct(x.completionRate)}</td><td>${x.format==='rewarded'?pct(x.claimRate):'-'}</td><td>${ms(x.averageLoadMs)} / ${ms(x.averageShowMs)} / ${ms(x.averagePlaybackMs)}</td></tr>`).join('')||empty(17)}</tbody></table></div>
    <div class="panel"><div class="panel-head"><div><h2>失败原因明细</h2><p>失败按主阶段与 TikTok 子错误码归类</p></div></div><table><thead><tr><th>日期</th><th>版本</th><th>平台</th><th>形式</th><th>业务位</th><th>失败阶段</th><th>错误码</th><th>子错误码</th><th>次数</th></tr></thead><tbody>${failureItems.map(x=>`<tr><td>${h(x.date)}</td><td>${h(x.clientVersion)}</td><td>${h(x.platform)}</td><td>${h(formatName[x.format]||x.format)}</td><td>${h(placementName[x.placement]||x.placement)}</td><td>${h(stageName[x.stage]||x.stage)}</td><td>${h(x.errorCode)}</td><td>${h(x.subErrorCode||'-')}</td><td>${num(x.count)}</td></tr>`).join('')||empty(9,'暂无失败数据')}</tbody></table></div>`;
    $$('[data-ad-view]').forEach(button=>button.onclick=()=>{if(adView===button.dataset.adView)return;adView=button.dataset.adView;ads()});if(placements.length&&window.Chart){$('#adPlacementChartWrap').style.height=Math.max(330,placements.length*56)+'px';charts.push(new Chart($('#adPlacementChart'),{type:'bar',data:{labels:placements.map(placementLabel),datasets:[{label:'预加载',data:placements.map(x=>x.preloads),backgroundColor:'#8872b2',borderRadius:5},{label:'请求',data:placements.map(x=>x.requests),backgroundColor:'#d85f34',borderRadius:5},{label:'展示',data:placements.map(x=>x.shows),backgroundColor:'#5f91b4',borderRadius:5},{label:'完成',data:placements.map(x=>x.successes),backgroundColor:'#438b69',borderRadius:5}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}},plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:context=>`${context.dataset.label} ${num(context.raw)}`}}}}}))}
  }
  async function startup(){const data=await api('/api/gm/stats/startup',filter()),s=data.summary||{},items=data.breakdown||[];$('#content').innerHTML=`${pageTitle('启动诊断','匿名查看 SDK 登录、服务端换取身份和首个可操作界面的真实结果')}<div class="scope"><b>当前口径：</b>按服务端收到事件的日期统计；不采集登录 code、Token、OpenID 或玩家 ID。这里只诊断我们可观测的启动链路，TikTok 官方启动成功率仍以平台后台为准。</div><div class="cards">${card('SDK 登录尝试',num(s.sdkAttempts||0),'客户端调用 TikTok 静默登录')}${card('SDK 登录成功率',pct(s.sdkSuccessRate||0),`${num(s.sdkSuccesses||0)} 成功 / ${num(s.sdkFailures||0)} 失败`,'good')}${card('服务端换取身份成功率',pct(s.exchangeSuccessRate||0),`${num(s.exchangeSuccesses||0)} 成功 / ${num(s.exchangeFailures||0)} 失败`)}${card('进入可操作界面率',pct(s.interactiveRate||0),`${num(s.interactiveReady||0)} 次到达首页或新手关`,'hot')}</div><div class="panel"><div class="panel-head"><div><h2>版本与设备明细</h2><p>优先查看失败事件是否集中在某个客户端版本、系统、TikTok 版本或基础库版本</p></div></div><table><thead><tr><th>日期</th><th>客户端版本</th><th>系统</th><th>TikTok 版本</th><th>SDK 版本</th><th>阶段</th><th>错误码</th><th>次数</th><th>平均耗时</th></tr></thead><tbody>${items.map(x=>`<tr><td>${h(x.date)}</td><td>${h(x.clientVersion)}</td><td>${h(x.os)}</td><td>${h(x.tiktokVersion)}</td><td>${h(x.sdkVersion)}</td><td>${h(startupStageName[x.stage]||x.stage)}</td><td>${h(x.errorCode||'-')}</td><td>${num(x.count)}</td><td>${ms(x.averageMs)}</td></tr>`).join('')||empty(9,'当前版本发布后才开始采集启动诊断')}</tbody></table></div>`}
  async function levels(){const [levelItems,funnel]=await Promise.all([api('/api/gm/stats/levels',filter()),api('/api/gm/stats/funnel',filter())]),max=Math.max(1,...levelItems.map(x=>x.players));$('#content').innerHTML=`${pageTitle('关卡分析','观察主线进度分布与关键步骤流失')}<div class="scope"><b>当前限制：</b>现有客户端事件没有携带玩法模式，本页只按关卡号汇总，无法可靠拆分“主线”和“每日挑战”；已列入后续客户端优化，不改当前提审包。</div><div class="two"><div class="panel"><div class="panel-head"><div><h2>活跃玩家当前进度</h2><p>所选日期内活跃玩家的最高主线关卡</p></div></div><div class="bars">${levelItems.map(x=>`<div class="bar-row"><span>第 ${Number(x.level)+1} 关</span><div class="track"><div class="fill" style="width:${x.players/max*100}%"></div></div><b>${num(x.players)}</b></div>`).join('')||'<div class="empty">暂无数据</div>'}</div></div><div class="panel"><div class="panel-head"><div><h2>关卡步骤漏斗</h2><p>按步骤首次发生日期统计人数</p></div></div><table><thead><tr><th>关卡</th><th>步骤</th><th>玩家数</th></tr></thead><tbody>${funnel.map(x=>`<tr><td>第 ${Number(x.level)+1} 关</td><td>${h(stepName[x.step]||x.step)}</td><td>${num(x.users)}</td></tr>`).join('')||empty(3)}</tbody></table></div></div>`}
  async function themes(){const [themes,props]=await Promise.all([api('/api/gm/stats/themes',filter()),api('/api/gm/stats/props',filter())]),maxT=Math.max(1,...themes.map(x=>x.count)),maxP=Math.max(1,...props.map(x=>x.count)),propName={hint:'魔杖',shuffle:'洗牌',remove:'火箭消除',potion:'魔药'};$('#content').innerHTML=`${pageTitle('主题与道具','按事件发生日期查看内容偏好与道具消耗')}<div class="two"><div class="panel"><div class="panel-head"><div><h2>主题选择次数</h2><p>同一玩家多次选择会重复计数</p></div></div><div class="bars">${themes.map(x=>`<div class="bar-row"><span>主题 ${Number(x.key)+1}</span><div class="track"><div class="fill" style="width:${x.count/maxT*100}%"></div></div><b>${num(x.count)}</b></div>`).join('')||'<div class="empty">暂无数据</div>'}</div></div><div class="panel"><div class="panel-head"><div><h2>道具使用次数</h2><p>魔杖、洗牌、火箭消除和魔药的实际使用</p></div></div><div class="bars">${props.map(x=>`<div class="bar-row"><span>${h(propName[x.key]||x.key)}</span><div class="track"><div class="fill" style="width:${x.count/maxP*100}%"></div></div><b>${num(x.count)}</b></div>`).join('')||'<div class="empty">暂无数据</div>'}</div></div></div>`}
  async function ranking(){const items=await api('/api/gm/stats/ranking',filter());$('#content').innerHTML=`${pageTitle('闯关排行','所选日期新增玩家的累计主线进度')}<div class="scope"><b>当前口径：</b>先筛选日期内首次进入的新增玩家，再按其截至当前的累计最高主线关卡、在线时长排序；首次与最近登录均按 Asia/Tokyo 显示。</div><div class="panel"><table><thead><tr><th>排名</th><th>玩家 ID</th><th>当前主线关</th><th>累计登录</th><th>累计在线</th><th>首次登录</th><th>最近登录</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${h(x.playerId)}</td><td><span class="pill good">第 ${Number(x.currentLevel)+1} 关</span></td><td>${num(x.loginCount)}</td><td>${duration(x.onlineDuration)}</td><td>${dateTime(x.createdAt)}</td><td>${dateTime(x.lastLoginAt)}</td></tr>`).join('')||empty(7)}</tbody></table></div>`}
  $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginStatus').textContent='登录中…';try{const d=await api('/api/gm/login',{account:$('#account').value.trim(),password:$('#password').value});localStorage.setItem(SESSION,d.session);$('#password').value='';$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#loginStatus').textContent='';load()}catch(error){$('#loginStatus').textContent=error.message}}
  $$('.tab').forEach(button=>button.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active');tab=button.dataset.tab;load()});$('#refresh').onclick=()=>{trendCache=null;load()};$('#sdk').onchange=()=>{trendCache=null;load()};$('#logout').onclick=()=>{api('/api/gm/logout').catch(()=>{});showLogin()};
  $('#dateRangeTrigger').onclick=openDatePanel;$('#dateRangePanel').onclick=event=>event.stopPropagation();$('#prevMonth').onclick=()=>{viewMonth=moveMonth(viewMonth,-1);renderCalendars()};$('#nextMonth').onclick=()=>{viewMonth=moveMonth(viewMonth,1);renderCalendars()};$$('[data-range]').forEach(button=>button.onclick=()=>setQuickRange(button.dataset.range));$('#resetRange').onclick=()=>{setQuickRange('today');applyDateRange()};$('#applyRange').onclick=applyDateRange;document.addEventListener('click',()=>$('#dateRangePanel').classList.remove('open'));
  $('#trendClose').onclick=closeTrend;$('#trendModal').onclick=event=>{if(event.target===$('#trendModal'))closeTrend()};$$('[data-trend-view]').forEach(button=>button.onclick=()=>setTrendView(button.dataset.trendView));document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('#trendModal').classList.contains('hidden'))closeTrend();$('#dateRangePanel').classList.remove('open')}});
  (async()=>{$('#from').value=localDate();$('#to').value=localDate();updateDateLabel();try{const r=await fetch('/config/timezone'),j=await r.json();$('#timezone').textContent=j.timezone||'Asia/Tokyo'}catch{$('#timezone').textContent='Asia/Tokyo'}if(localStorage.getItem(SESSION)){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}})();
  </script>
</body>
</html>
